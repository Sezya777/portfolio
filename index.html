<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Сайырбекова Сезимай — портфолио</title>
<style>
:root {
  --bg: #fffafb;
  --ink: #3b2a33;
  --plum: #4a1d38;
  --muted: #9a7a8c;
  --magenta: #c0507c;
  --pink: #f4a9c6;
  --side: #7a3550;
  --card: #ffffff;
  --line: #f0d6e2;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  line-height: 1.65;
}
a { color: var(--magenta); }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

/* ---------- Прогресс прокрутки ---------- */
.progress {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--pink), var(--magenta));
  transform-origin: left;
  z-index: 30;
}

/* ---------- Шапка ---------- */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 18px clamp(20px, 5vw, 64px);
  position: sticky;
  top: 0;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  z-index: 20;
  transition: padding 0.3s var(--ease), box-shadow 0.3s ease;
}
.nav.scrolled { padding-top: 12px; padding-bottom: 12px; box-shadow: 0 6px 24px rgba(122, 53, 80, 0.1); }
.nav-name { font-weight: 700; font-size: 16px; color: var(--plum); text-decoration: none; }
.nav nav { display: flex; gap: 22px; }
.nav nav a { position: relative; color: var(--muted); text-decoration: none; font-weight: 600; padding: 4px 0; transition: color 0.2s ease; }
.nav nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--pink); transform: scaleX(0); transform-origin: left; transition: transform 0.35s var(--ease); }
.nav nav a:hover, .nav nav a.on { color: var(--magenta); }
.nav nav a:hover::after, .nav nav a.on::after { transform: scaleX(1); }

/* ---------- Главный экран ---------- */
.hero { position: relative; max-width: 1100px; margin: 0 auto; padding: clamp(48px, 8vw, 96px) clamp(20px, 5vw, 64px) 48px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; }
.hero::before {
  content: "";
  position: absolute;
  inset: -40px -200px;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(520px circle at var(--hx, 72%) var(--hy, 30%), color-mix(in srgb, var(--pink) 38%, transparent), transparent 65%);
}
.hero > * { position: relative; z-index: 1; }

.hero-city { margin: 0 0 12px; min-height: 1.6em; color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 14px; letter-spacing: 0.02em; }
.caret { display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -2px; background: var(--magenta); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.hero h1 { font-size: clamp(40px, 8vw, 92px); line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 24px; font-weight: 400; }
.hero h1 .first, .hero h1 .last { display: block; }
.hero h1 .first { font-weight: 700; color: var(--plum); }
.hero h1 .last { color: var(--magenta); }
.char-wrap { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.12em; margin-bottom: -0.12em; }
.char { display: inline-block; transform: translateY(115%) rotate(6deg); animation: char-up 0.9s var(--ease) forwards; animation-delay: calc(var(--d) * 50ms + 150ms); }
@keyframes char-up { to { transform: none; } }

.hero-intro { max-width: 52ch; font-size: 1.15rem; margin: 0 0 32px; }

.btn {
  display: inline-block;
  position: relative;
  overflow: hidden;
  background: var(--side);
  color: #fff;
  font-weight: 700;
  text-decoration: none;
  padding: 14px 28px;
  border-radius: 999px;
  transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s var(--ease);
}
.btn span { position: relative; z-index: 1; }
.btn::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent); transform: skewX(-20deg); }
.btn:hover { background: var(--magenta); box-shadow: 0 10px 24px rgba(192, 80, 124, 0.35); }
.btn:hover::after { left: 130%; transition: left 0.7s var(--ease); }

/* ---------- Разделы ---------- */
.section { padding: 72px clamp(20px, 5vw, 64px); max-width: 1100px; margin: 0 auto; }
.section h2 { display: flex; align-items: center; gap: 16px; color: var(--plum); font-size: clamp(24px, 3.5vw, 34px); margin: 0 0 28px; }
.section h2::after { content: ""; flex: 1; height: 4px; background: var(--pink); border-radius: 2px; transform: scaleX(0); transform-origin: left; transition: transform 1.1s var(--ease) 0.25s; }
.section h2.is-shown::after { transform: scaleX(1); }

.photo-ring { position: relative; width: clamp(220px, 30vw, 320px); aspect-ratio: 1; padding: 12px; border: 3px solid var(--pink); border-radius: 50%; margin: 0 auto; transition: transform 0.2s ease-out; will-change: transform; }
.photo-ring::before { content: ""; position: absolute; inset: -12px; border: 2px dashed var(--pink); border-radius: 50%; opacity: 0.7; animation: spin 40s linear infinite; }
.photo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; filter: grayscale(1); display: block; transition: filter 0.5s ease, transform 0.6s var(--ease); }
.photo-ring:hover img { filter: grayscale(0); transform: scale(1.05); }
@keyframes spin { to { transform: rotate(360deg); } }

.skills { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.skills li { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 12px; text-align: center; font-weight: 700; font-size: 18px; color: var(--plum); transition: background 0.2s ease, color 0.2s ease, transform 0.25s var(--ease), box-shadow 0.25s ease; }
.skills li:hover { background: var(--side); color: #fff; transform: translateY(-4px); box-shadow: 0 10px 22px rgba(122, 53, 80, 0.25); }
.skills.is-shown li { animation: pop 0.55s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms + 200ms); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.85); } }

/* ---------- Проекты ---------- */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.projects { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; }
.projects .card { grid-column: span 2; }
.projects .card:nth-child(n + 4) { grid-column: span 3; }
.card { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px; }
.card::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--pink) 40%, transparent), transparent 70%); }
.card > * { position: relative; }
.card:hover::before { opacity: 1; }
.card h3 { margin: 0; color: var(--plum); font-size: 19px; }
.card .big { font-weight: 700; color: var(--plum); font-size: 20px; line-height: 1.3; }
.lang-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lang-list li { padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--pink) 22%, transparent); font-weight: 600; color: var(--plum); }
.card p { margin: 0; color: var(--muted); }
.card .link { margin-top: auto; }
.contact-card { text-decoration: none; color: inherit; }
.contact-card .label { color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.contact-card .value { color: var(--magenta); font-weight: 700; font-size: clamp(18px, 2.2vw, 22px); word-break: break-word; }
.link { width: fit-content; font-weight: 700; text-decoration: none; background: linear-gradient(currentColor, currentColor) left bottom / 0 2px no-repeat; transition: background-size 0.4s var(--ease); padding-bottom: 2px; }
.link:hover { background-size: 100% 2px; }

/* ---------- Подвал ---------- */
.footer { padding: 32px clamp(20px, 5vw, 64px); color: var(--muted); border-top: 1px solid var(--line); }

/* ---------- Общие анимации ---------- */
.rise { opacity: 0; transform: translateY(24px); animation: rise 0.8s var(--ease) forwards; animation-delay: calc(var(--i) * 140ms + 100ms); }
@keyframes rise { to { opacity: 1; transform: none; } }

.reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.8s ease, transform 0.8s var(--ease); }
.reveal.is-shown { opacity: 1; transform: none; }
.card.reveal { transition: opacity 0.8s ease, transform 0.8s var(--ease), box-shadow 0.3s ease; }
.card.is-shown:hover { transform: translateY(-8px); box-shadow: 0 18px 36px rgba(122, 53, 80, 0.16); transition-delay: 0s; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .rise, .reveal, .char { opacity: 1; transform: none; animation: none; transition: none; }
  .caret, .photo-ring::before { animation: none; }
  .section h2::after { transform: none; transition: none; }
  .skills.is-shown li { animation: none; }
}

@media (max-width: 900px) {
  .skills { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: 1fr; }
  .projects { grid-template-columns: 1fr; }
  .projects .card, .projects .card:nth-child(n + 4) { grid-column: auto; }
}
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .hero-photo { order: -1; }
}

/* ---------- Тёмная тема ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1c0f16; --ink: #eadde4; --plum: #f6e4ed; --muted: #b79aaa; --magenta: #ee86ae;
    --card: #2a1722; --line: #432636; --side: #a24b72;
  }
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

</style>
</head>

// Печатающийся текст
function useTyped(text, delay = 1100, speed = 42) {
  const [n, setN] = useState(reduceMotion ? text.length : 0);
  useEffect(() => {
    if (reduceMotion) return;
    let i = 0;
    let t;
    const tick = () => {
      i += 1;
      setN(i);
      if (i < text.length) t = setTimeout(tick, speed);
    };
    const start = setTimeout(tick, delay);
    return () => {
      clearTimeout(start);
      clearTimeout(t);
    };
  }, [text, delay, speed]);
  return text.slice(0, n);
}

// Прогресс прокрутки страницы (0..1)
function useScrollProgress() {
  const [p, setP] = useState(0);
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        setP(max > 0 ? window.scrollY / max : 0);
        setScrolled(window.scrollY > 10);
      });
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      window.removeEventListener("scroll", onScroll);
      cancelAnimationFrame(raf);
    };
  }, []);
  return [p, scrolled];
}

// Какой раздел сейчас на экране
function useActiveSection(ids) {
  const [active, setActive] = useState("");
  useEffect(() => {
    if (!("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => e.isIntersecting && setActive(e.target.id)),
      { rootMargin: "-40% 0px -55% 0px" }
    );
    ids.forEach((id) => {
      const el = document.getElementById(id);
      if (el) io.observe(el);
    });
    return () => io.disconnect();
  }, [ids]);
  return active;
}

/* ---------- Компоненты ---------- */

// Плавное появление блока при прокрутке
function Reveal({ as: Tag = "div", delay = 0, className = "", children, ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el || !("IntersectionObserver" in window)) {
      setShown(true);
      return;
    }
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setShown(true);
          io.disconnect();
        }
      },
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <Tag
      ref={ref}
      className={`reveal ${shown ? "is-shown" : ""} ${className}`}
      style={{ transitionDelay: `${delay}ms` }}
      {...rest}
    >
      {children}
    </Tag>
  );
}

// Имя: буквы выезжают по одной
function SplitText({ text, start = 0 }) {
  return (
    <span aria-hidden="true">
      {[...text].map((ch, i) => (
        <span className="char-wrap" key={i}>
          <span className="char" style={{ "--d": start + i }}>{ch}</span>
        </span>
      ))}
    </span>
  );
}

// Кнопка слегка тянется за курсором
function MagneticButton({ href, children }) {
  const ref = useRef(null);
  const move = (e) => {
    if (reduceMotion) return;
    const r = ref.current.getBoundingClientRect();
    const x = (e.clientX - (r.left + r.width / 2)) * 0.25;
    const y = (e.clientY - (r.top + r.height / 2)) * 0.35;
    ref.current.style.transform = `translate(${x}px, ${y}px)`;
  };
  const leave = () => (ref.current.style.transform = "");
  return (
    <a ref={ref} className="btn rise" style={{ "--i": 4 }} href={href} onMouseMove={move} onMouseLeave={leave}>
      <span>{children}</span>
    </a>
  );
}

// Фото наклоняется вслед за курсором
function Photo({ src, alt }) {
  const ref = useRef(null);
  const move = (e) => {
    if (reduceMotion) return;
    const r = ref.current.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    ref.current.style.transform = `perspective(600px) rotateY(${x * 16}deg) rotateX(${-y * 16}deg)`;
  };
  const leave = () => (ref.current.style.transform = "");
  return (
    <div className="photo-ring" ref={ref} onMouseMove={move} onMouseLeave={leave}>
      <img src={src} alt={alt} />
    </div>
  );
}

// Подсветка карточки под курсором
function spotlight(e) {
  const r = e.currentTarget.getBoundingClientRect();
  e.currentTarget.style.setProperty("--mx", `${e.clientX - r.left}px`);
  e.currentTarget.style.setProperty("--my", `${e.clientY - r.top}px`);
}
